name: Build AutoTax V1.2.2 APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-lite/**'
      - '.github/workflows/build-autotax-apk-v122.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Lite and Full APK
        working-directory: android-lite
        run: gradle --no-daemon assembleLiteDebug assembleFullDebug
      - name: Collect APKs
        run: |
          mkdir -p android-lite/out
          cp android-lite/app/build/outputs/apk/lite/debug/app-lite-debug.apk android-lite/out/AutoTax_Lite_V1.2.2.apk
          cp android-lite/app/build/outputs/apk/full/debug/app-full-debug.apk android-lite/out/AutoTax_Full_V1.2.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTax-1.2.2-APKs
          path: android-lite/out/*.apk
          if-no-files-found: error
          compression-level: 0
