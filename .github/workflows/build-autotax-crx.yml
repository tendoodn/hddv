name: Build AutoTax installable ZIP (optional enterprise CRX)
on:
  push:
    branches: [main]
    paths:
      - "autotax/**"
      - "scripts/verify-v32-sync.mjs"
      - ".github/workflows/build-autotax-crx.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension source and licensing API references
        run: node scripts/verify-v32-sync.mjs
      - name: Test offline Tendoo SKU import and Excel ZIP logic
        run: |
          node --check autotax/src/content/tendoo-import.js
          node --check autotax/src/sidepanel/panel.js
          node --check autotax/src/sidepanel/tendoo-match.js
          node --check autotax/src/content/content.js
          node --check autotax/src/license/license.js
          node --check docs/customer.js
          node tests/v32/tendoo-import.test.mjs
      - name: Produce minified Chrome-Web-Store-compliant release sources
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts terser@5.44.0
          RELEASE="$RUNNER_TEMP/autotax-release"
          mkdir -p "$RELEASE"
          cp -a autotax/. "$RELEASE/"
          while IFS= read -r -d '' FILE; do
            node_modules/.bin/terser "$FILE" --compress --mangle \
              --format comments=false --output "$FILE.min.js"
            node --check "$FILE.min.js"
            mv "$FILE.min.js" "$FILE"
          done < <(find "$RELEASE" -type f -name '*.js' -print0)
          echo "AUTOTAX_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Release JS minified without prohibited obfuscation."
      - name: Install Chrome packer if absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null || command -v chromium >/dev/null || command -v chromium-browser >/dev/null; then
            echo "Chrome extension packer is available"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          fi
      - name: Prepare signing key (no private key in artifacts)
        shell: bash
        env:
          CRX_KEY_B64: ${{ secrets.AUTOTAX_CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/autotax-signing.pem"
          if [[ -n "$CRX_KEY_B64" ]]; then
            printf '%s' "$CRX_KEY_B64" | base64 -d > "$KEY"
            openssl pkey -in "$KEY" -check -noout >/dev/null
            chmod 600 "$KEY"
            echo "SIGNING_MODE=STABLE_ENTERPRISE" >> "$GITHUB_ENV"
            echo "::notice::Using permanent signing key. CRX is for managed Chrome / supported Linux, not ordinary Windows installation."
          else
            echo "SIGNING_MODE=UNPACKED_ONLY" >> "$GITHUB_ENV"
            echo "::notice::No permanent signing key: distribute the verified unpacked ZIP only. Do not generate a misleading CRX."
          fi
      - name: Build and verify installable ZIP (optional enterprise CRX3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [[ "$SIGNING_MODE" == "STABLE_ENTERPRISE" ]]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --no-default-browser-check \
              --pack-extension="$AUTOTAX_RELEASE" \
              --pack-extension-key="$RUNNER_TEMP/autotax-signing.pem"
          fi
          python3 - <<'PY'
          import json, pathlib, struct, zipfile, os
          root=pathlib.Path(os.environ["AUTOTAX_RELEASE"])
          version=json.loads((root/"manifest.json").read_text(encoding="utf8"))["version"]
          target=pathlib.Path("dist")
          output=target/f"autotax-v{version}.zip"
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.suffix==".md" or p.name.endswith(".pem"): continue
                  info=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(2020,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          # Validate every ZIP member checksum and every resource referenced by the manifest.
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None, "ZIP checksum failure"
              names=set(z.namelist())
              assert {"manifest.json","src/sidepanel/index.html","src/sidepanel/panel.js",
               "src/license/license.js","src/content/content.js","src/content/hddt-api.js",
               "src/background/service-worker.js","src/content/tendoo-import.js"}.issubset(names), "Required extension files missing"
              assert not any(name.endswith((".pem",".min.js")) for name in names), "Private key or temporary file leaked!"
              manifest=json.loads(z.read("manifest.json").decode("utf-8"))
              assert manifest["manifest_version"]==3
              assert "update_url" not in manifest, "Unpacked release must not claim Chrome Web Store updates"
              referenced=[
               manifest["background"]["service_worker"],
               manifest["side_panel"]["default_path"],
               *manifest.get("icons",{}).values(),
               *manifest.get("action",{}).get("default_icon",{}).values()
              ]
              for script in manifest.get("content_scripts",[]):
                  referenced+=script.get("js",[])
              missing=[p for p in referenced if p not in names]
              assert not missing,"Manifest references missing packaged files: "+str(missing)
          mode=os.environ.get("SIGNING_MODE","UNPACKED_ONLY")
          if mode=="STABLE_ENTERPRISE":
              packed=pathlib.Path(os.environ["AUTOTAX_RELEASE"]+".crx")
              assert packed.exists() and packed.stat().st_size>10000,"Chrome did not output CRX"
              with packed.open("rb") as crx:
                  assert crx.read(4)==b"Cr24","Not a Chrome extension"
                  assert struct.unpack("<I",crx.read(4))[0]==3,"Not CRX3"
              crx_target=target/f"autotax-v{version}-enterprise-linux-only.crx"
              packed.replace(crx_target)
              print(f"Built {crx_target} ({crx_target.stat().st_size} bytes) for enterprise/Linux only")
          (target/"HUONG_DAN_CAI_DAT.txt").write_text(
              f"AutoTax {version} - ban cai dat ZIP da kiem tra checksum va tai nguyen.\n\n"
              "CAI CHO CHROME TREN WINDOWS / MAC:\n"
              "1. Giai nen file autotax-v*.zip vao mot thu muc rieng.\n"
              "2. Mo Chrome, nhap chrome://extensions tren thanh dia chi.\n"
              "3. Bat Che do danh cho nha phat trien (Developer mode).\n"
              "4. Chon Tai tien ich da giai nen (Load unpacked).\n"
              "5. Chon thu muc CHUA file manifest.json, khong chon file ZIP/CRX.\n"
              "6. Giu nguyen thu muc da giai nen de tien ich hoat dong.\n\n"
              "Luu y: Chrome Windows/Mac thuong khong cho cai file CRX ngoai Chrome Web Store.\n"
              "De phan phoi cho khach hang khong can Developer mode, hay xuat ban tren Chrome Web Store.\n"
              "Chi khi cau hinh signing key on dinh moi co the dong goi CRX cho Chrome Enterprise / Linux.\n"
              f"Build mode: {mode}.\n",
              encoding="utf8")
          print(f"ZIP passed CRC/resource checks: {output} ({output.stat().st_size} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autotax-verified-zip-optional-enterprise-crx
          path: dist/*
          retention-days: 30
