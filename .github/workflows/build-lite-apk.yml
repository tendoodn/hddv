name: Build AutoTax V1.2.0 Lite and Full APKs
on:
  push:
    branches: [main]
    paths:
      - 'android-lite/**'
      - '.github/workflows/build-lite-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-lite:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build two independently installable hybrid Android apps
        run: gradle --no-daemon --stacktrace -p android-lite :app:assembleLiteDebug :app:assembleFullDebug
      - name: Verify branded Android APKs
        run: |
          set -euo pipefail
          cp android-lite/app/build/outputs/apk/lite/debug/app-lite-debug.apk AutoTax_Lite_V1.2.0.apk
          cp android-lite/app/build/outputs/apk/full/debug/app-full-debug.apk AutoTax_Full_V1.2.0.apk
          for apk in AutoTax_Lite_V1.2.0.apk AutoTax_Full_V1.2.0.apk; do
            test -s "$apk"
            file "$apk"
            unzip -t "$apk" | tail -1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTax_V1.2.0_Android_Lite_and_Full_debug_signed
          path: |
            AutoTax_Lite_V1.2.0.apk
            AutoTax_Full_V1.2.0.apk
          if-no-files-found: error
          retention-days: 30
