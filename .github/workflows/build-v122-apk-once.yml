name: Build AutoTax V1.2.2 Lite and Full APKs (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v122-apk-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Android build source from pre-move snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout 896d28fe0aa97b89a642fea6d58b0e2a1eefb409 -- android-lite
          sed -i "s/versionCode 1200/versionCode 1202/" android-lite/app/build.gradle
          sed -i "s/versionName '1.2.0'/versionName '1.2.2'/" android-lite/app/build.gradle
          sed -i 's/V1.2.0/V1.2.2/g' android-lite/app/src/main/java/top/tracuuhoadon/autotaxlite/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Lite and Full APKs
        run: gradle --no-daemon --stacktrace -p android-lite :app:assembleLiteDebug :app:assembleFullDebug
      - name: Verify and rename APKs
        shell: bash
        run: |
          set -euo pipefail
          cp android-lite/app/build/outputs/apk/lite/debug/app-lite-debug.apk AutoTax_Lite_V1.2.2.apk
          cp android-lite/app/build/outputs/apk/full/debug/app-full-debug.apk AutoTax_Full_V1.2.2.apk
          for apk in AutoTax_Lite_V1.2.2.apk AutoTax_Full_V1.2.2.apk; do
            test -s "$apk"
            unzip -t "$apk" | tail -1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTax_V1.2.2_Android_Lite_and_Full_debug
          path: |
            AutoTax_Lite_V1.2.2.apk
            AutoTax_Full_V1.2.2.apk
          if-no-files-found: error
          retention-days: 30
