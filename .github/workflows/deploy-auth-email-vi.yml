name: Việt hóa email xác thực AutoTax trên Supabase
on:
  push:
    branches: [main]
    paths:
      - 'auth/email-templates/**'
      - '.github/workflows/deploy-auth-email-vi.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autotax-supabase-auth-email-vi
  cancel-in-progress: false
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Vietnamese email templates
        run: python3 auth/email-templates/deploy_templates.py --check
      - name: Apply templates via official Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "NOT DEPLOYED: GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing."
            echo "## Chưa cập nhật được email trực tiếp trên Supabase" >> "$GITHUB_STEP_SUMMARY"
            echo "Thiếu repository Actions secret SUPABASE_ACCESS_TOKEN. Mẫu tiếng Việt đã được kiểm tra, nhưng Auth Templates trên Supabase chưa thay đổi." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 auth/email-templates/deploy_templates.py --apply
          echo "## Đã áp dụng và xác minh 13 mẫu email tiếng Việt" >> "$GITHUB_STEP_SUMMARY"
          echo "Chỉ sửa tiêu đề và nội dung email. SMTP, cấu hình domain và trạng thái bật/tắt thông báo được giữ nguyên." >> "$GITHUB_STEP_SUMMARY"
