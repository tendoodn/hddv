name: Export AutoTax V1.2.2 Chrome ZIP
on:
  push:
    branches: [main]
    paths:
      - 'release/AutoTax.1.2.2.zip'
      - '.github/workflows/export-autotax-zip-v122.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate release package
        run: |
          unzip -t release/AutoTax.1.2.2.zip
          python3 - <<'PY'
          import json,zipfile
          p='release/AutoTax.1.2.2.zip'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='1.2.2'
              assert m.get('version_name')=='1.2.2'
              assert 'web-auth-sync.js' in z.namelist()
          print('AutoTax 1.2.2 ZIP validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTax.1.2.2
          path: release/AutoTax.1.2.2.zip
          if-no-files-found: error
          compression-level: 0
