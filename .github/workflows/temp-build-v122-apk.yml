name: Temporary Build AutoTax V1.2.2 APKs
on:
  push:
    branches: [main]
    paths:
      - 'android-lite/**'
      - '.github/workflows/temp-build-v122-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Lite + Full
        run: gradle --no-daemon --stacktrace -p android-lite :app:assembleLiteDebug :app:assembleFullDebug
      - name: Prepare APKs
        run: |
          cp android-lite/app/build/outputs/apk/lite/debug/app-lite-debug.apk AutoTax_Lite_V1.2.2.apk
          cp android-lite/app/build/outputs/apk/full/debug/app-full-debug.apk AutoTax_Full_V1.2.2.apk
          test -s AutoTax_Lite_V1.2.2.apk
          test -s AutoTax_Full_V1.2.2.apk
          unzip -t AutoTax_Lite_V1.2.2.apk | tail -1
          unzip -t AutoTax_Full_V1.2.2.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTax_V1.2.2_APKs
          path: |
            AutoTax_Lite_V1.2.2.apk
            AutoTax_Full_V1.2.2.apk
          retention-days: 1
