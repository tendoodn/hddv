name: Verify AutoTax v1.1.22 live routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-autotax.yml'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for published pages then verify route content
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, sys
          origin = "https://tracuuhoadon.top"
          checks = {
              "/": ["<title>AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "web/web-results.js?v=1122h", "web/web.css?v=1122h", "web/stock-cache.js?v=1122g", 'id="stockSkuDialog"', "Liên kết lại mã hàng", 'class="dialog-heading sku-map-sticky-head"', 'id="stockSkuOpen"', "Cập nhật file mẫu SKU / Mã hàng"],
              "/user/": ["<title>AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "authSection", 'href="/admin/" id="adminLink"', 'href="/admin/" hidden>Trang quản trị'],
              "/admin/": ["<title>Admin AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "Đăng nhập quản trị", "bootOnce", 'window.location.replace("/user")'],
              "/web/date-slide-picker.js": ["AutoTaxWebDatePicker", "touchstart", "Tháng"],
              "/web/web-results.js": ["resultPageSize=10", "RESULT_PAGE_SIZES=new Set([10,20,30])", "commitCatalogFile", "stockSkuSave", "stockSkuData365", "detectMismatch", "scheduleMismatchCheck", "catalogMst"],
              "/web/account-modal.js": ["if(id==='webLoginDialog')continue;", "data-web-close"],
              "/web/web.js": ["function showQuotaWarning", "QUOTA_MESSAGE", "Hãy bấm Đăng nhập ở phía trên để sử dụng AutoTax."],
              "/web/web.css": [".autotax-quota-dialog", ".stock-sku-dialog", ".sku-map-sticky-head", "#stockExport .stock-grid"],
              "/web/vault.js": ["mst-permission-tick", "Đã cấp quyền sử dụng", "mst-picker-head", "head.append(permission)"],
              "/web/stock-cache.js": ["AES-GCM", "keyOf=(user,platform)", "mst:taxId(mst)", "entitled(client)"],
              "/web/pdf.js": ["Signature valid", "drawSignatureWatermark", "Bản thể hiện dựng từ dữ liệu"],
              "/web/export-zip.js": ["PDF_Dung_Tu_Thue_", "Bang_Thong_Ke_"],
          }
          failed = []
          for route, tokens in checks.items():
              latest = ""
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(origin+route,headers={"Cache-Control":"no-cache"}),
                          timeout=15
                      ) as response:
                          body=response.read().decode("utf-8","replace")
                          missing=[token for token in tokens if token not in body]
                          if response.status==200 and not missing:
                              print("PASS",route,len(body));break
                          latest="missing "+repr(missing)
                  except Exception as exc:
                      latest=str(exc)
                  time.sleep(5)
              else:
                  failed.append((route,latest))
          for route,error in failed:
              print("FAIL",route,error)
          if failed:
              print("Live site does not yet match the current deployed AutoTax release.")
              sys.exit(1)
          PY
