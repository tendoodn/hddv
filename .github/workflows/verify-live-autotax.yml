name: Verify AutoTax v1.1.26 team MST profiles without passwords
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-autotax.yml'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for published pages then verify route content
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, sys
          origin = "https://tracuuhoadon.top"
          checks = {
              "/": ["<title>AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "WEB V1.1.26", "data365-payment.js?v=1123data365qr1", "web/web-results.js?v=1123data365qr1", "web/web.css?v=1125recent", "web/stock-cache.js?v=1122g", "web/tendoo-import.js?v=1123", "web/invoice-cache-v120.js?v=1123", "web/report.js?v=1125codes", "team-shared-v119.js?v=1126metadataonly", "web/vault.js?v=1126profilesonly", "web/web.js?v=1126profilesonly", 'id="clearLocalInvoiceHistory"', 'id="stockSkuDialog"', "Liên kết lại mã hàng", 'class="dialog-heading sku-map-sticky-head"', 'id="stockSkuOpen"', "Cập nhật file mẫu SKU / Mã hàng"],
              "/user/": ["<title>AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "AUTOTAX <span>V1.1.26</span>", 'id="invoiceTeamLimit"', 'id="mstTeamLimit"', "team-shared-v119.js?v=1126metadataonly", "team-v118.js?v=1126profilesonly", "customer.js?v=1125grantfix1", 'id="mstAllowHelp"', "Thiết lập lại quyền sử dụng"],
              "/admin/": ["<title>Admin AutoTax - Tra Cứu &amp; Tải HĐĐT</title>", "AUTOTAX <span>V1.1.26 · ADMIN</span>", "adminSessionPending", "Đăng nhập quản trị", "bootOnce", 'window.location.replace("/user")', 'id="grantCustomerSearch"', 'id="grantCustomerMatches"', 'function renderGrantMatches()'],
              "/data365-payment.js": ["package_code:'DATA365',coupon_code:null,replace_order_id:null", "addon_my_order_status", "data?.status==='paid'", "setState(SUCCESS,'success')", "5000)"],
              "/customer.js": ['if(packageCode==="DATA365")', "Thanh toán QR DATA365", "autotax_member_authorize_shared_mst_v120", "$('mstGrantUnlock').disabled=false", "$('mstGrantCancel').hidden=!mstGrantUnlocked", "box.dataset.sharedReadonly==='true'", "personalMstCapacity"],
              "/admin-site-links.js": ["$('adminComboPackagesLink')?.remove();"],
              "/team-shared-v119.js": ["AutoTaxTeamShared", "autotax_team_shared_mst_profiles_v119", "Object.freeze({setAuthProvider,context,list})"],
              "/team-v118.js": ["renderSharedMstPanel", "Hồ sơ MST trưởng nhóm chia sẻ", "autotax_team_set_permissions_v118"],
              "/web/vault.js": ["Mật khẩu của trưởng nhóm được bảo mật", "source:'team'", "autotax_member_authorize_shared_mst_v120", "autotax-team-msts-revoked"],
              "/web/report.js": ["const productCodeOf", "productCodeOf(l)", "Mã hàng hóa"],
              "/web/date-slide-picker.js": ["AutoTaxWebDatePicker", "touchstart", "Tháng"],
              "/web/web-results.js": ["resultPageSize=10", "RESULT_PAGE_SIZES=new Set([10,20,30])", "commitCatalogFile", "stockSkuSave", "stockSkuData365", "AutoTaxData365Payment.open", "detectMismatch", "scheduleMismatchCheck", "catalogMst"],
              "/web/account-modal.js": ["if(id==='webLoginDialog')continue;", "data-web-close"],
              "/web/web.js": ["function showQuotaWarning", "QUOTA_MESSAGE", "Hãy bấm Đăng nhập ở phía trên để sử dụng AutoTax.", "clearLocalInvoiceHistory"],
              "/web/web.css": [".autotax-quota-dialog", ".stock-sku-dialog", ".sku-map-sticky-head", "#stockExport .stock-grid"],

              "/web/stock-cache.js": ["AES-GCM", "keyOf=(user,platform)", "mst:taxId(mst)", "entitled(client)"],
              "/web/invoice-cache-v120.js": ["DETAIL_RETENTION_DAYS=10", "clearForAccount", "get,put,stats"],
              "/web/tendoo-import.js": ["outputSku(line,product)", "THIẾU MÃ", "gợi ý"],
              "/web/pdf.js": ["Signature valid", "drawSignatureWatermark", "Bản thể hiện dựng từ dữ liệu"],
              "/web/export-zip.js": ["PDF_Dung_Tu_Thue_", "Bang_Thong_Ke_"],
          }
          blocked = {
              "/team-v118.js": ["Mật khẩu MST ", "publishSharedPasswords(", "Xem mật khẩu"],
              "/team-shared-v119.js": ["autotax_team_get_shared_mst_password_v119", "autotax_team_share_mst_password_v119"],
              "/web/vault.js": ["AutoTaxTeamShared?.get(mst)", "Đã điền mật khẩu MST do trưởng nhóm"],
          }
          failed = []
          for route, tokens in checks.items():
              latest = ""
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(origin+route,headers={"Cache-Control":"no-cache"}),
                          timeout=15
                      ) as response:
                          body=response.read().decode("utf-8","replace")
                          missing=[token for token in tokens if token not in body]
                          unexpected=[token for token in blocked.get(route,[]) if token in body]
                          if response.status==200 and not missing and not unexpected:
                              print("PASS",route,len(body));break
                          latest="missing "+repr(missing)+", unexpected "+repr(unexpected)
                  except Exception as exc:
                      latest=str(exc)
                  time.sleep(5)
              else:
                  failed.append((route,latest))
          for route,error in failed:
              print("FAIL",route,error)
          if failed:
              print("Live site does not yet match the current deployed AutoTax release.")
              sys.exit(1)
          PY
