name: Verify AutoTax v1.1.22 live routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-autotax.yml'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for published pages then verify route content
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, sys
          origin = "https://tracuuhoadon.top"
          checks = {
              "/": ["WEB V1.1.22b", "web/account-modal.js?v=1122e1", "web/web.js?v=1122e1", "web/web.css?v=1122e1", 'class="autotax-quota-renew"', "Hạn mức tài khoản đạt giới hạn. Vui lòng gia hạn thêm"],
              "/user/": ["AutoTax V1.1.22", "authSection", 'href="/admin/" id="adminLink"', 'href="/admin/" hidden>Trang quản trị'],
              "/admin/": ["Đăng nhập quản trị", "bootOnce", 'window.location.replace("/user")'],
              "/web/date-slide-picker.js": ["AutoTaxWebDatePicker", "touchstart", "Tháng"],
              "/web/account-modal.js": ["if(id==='webLoginDialog')continue;", "data-web-close"],
              "/web/web.js": ["function showQuotaWarning", "QUOTA_MESSAGE", "showQuotaWarning('invoice')"],
              "/web/web.css": [".autotax-quota-dialog", ".autotax-quota-renew", "#22c55e"],
              "/web/vault.js": ["mst-permission-tick", "Đã cấp quyền sử dụng", "mst-picker-head", "head.append(permission)"],
              "/web/web.css": [".mst-picker-permission", ".mst-picker-head", "#webRenewNow", "#22c55e"],
              "/web/pdf.js": ["Signature valid", "drawSignatureWatermark", "Bản thể hiện dựng từ dữ liệu"],
              "/web/export-zip.js": ["PDF_Dung_Tu_Thue_", "Bang_Thong_Ke_"],
          }
          failed = []
          for route, tokens in checks.items():
              latest = ""
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(origin+route,headers={"Cache-Control":"no-cache"}),
                          timeout=15
                      ) as response:
                          body=response.read().decode("utf-8","replace")
                          missing=[token for token in tokens if token not in body]
                          if response.status==200 and not missing:
                              print("PASS",route,len(body));break
                          latest="missing "+repr(missing)
                  except Exception as exc:
                      latest=str(exc)
                  time.sleep(5)
              else:
                  failed.append((route,latest))
          for route,error in failed:
              print("FAIL",route,error)
          if failed:
              print("Live site does not yet match the current deployed AutoTax release.")
              sys.exit(1)
          PY
