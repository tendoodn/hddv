name: Verify Live AutoTax Portal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-autotax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current pages, team, K and signup modal
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time, sys
          checks = {
            "https://tracuuhoadon.top/admin-combo.html": ["admin.html#packageCatalog"],
            "https://tracuuhoadon.top/": ['id="autotaxTeamTab"', 'id="signupDialog"', 'id="signupName"', 'id="signupPasswordConfirm"', 'VÀO TRA CỨU PHIÊN BẢN WEB', 'id="extensionHeaderDownloadBtn"', 'id="paymentCouponCode"', 'id="mstProfilesWeb"'],
            "https://tracuuhoadon.top/web.html": ['id="kIndustry"', 'web-results.js?v=1118k4', 'web.js?v=1118terminal3', 'id="progressLog"'],
            "https://tracuuhoadon.top/web/web.js": ["keepLog=false", "log.children.length>5", "Đã hoàn tất tải"],
            "https://tracuuhoadon.top/web/web.css": ["terminal-error", "terminal-success"],
            "https://tracuuhoadon.top/customer.js": ["signupDialog", "signupPasswordConfirm", "Supabase Auth"],
            "https://tracuuhoadon.top/admin.html": ['id="couponCreateForm"', 'id="newInvoiceQtyWrap"', 'admin-discounts-v119.js'],
            "https://tracuuhoadon.top/extension-link-v118.js": ["extensionHeaderDownloadBtn", "extensionDownloadBtn"],
            "https://tracuuhoadon.top/admin-discounts-v119.js": ["autotax_admin_create_discount_v119", "autotax_admin_list_discounts_v119"],
            "https://tracuuhoadon.top/team-v118.js": ["autotax_team_create_v118", "autotax_team_usage_stats_v118", "autotaxTeamUsageTab"],
            "https://tracuuhoadon.top/customer.js": ["hasInvoice!==hasMst", "applyPaymentCoupon"],
            "https://tracuuhoadon.top/web/period-k.js": ["purchase+stock", "shouldWarn"],
            "https://tracuuhoadon.top/team-v118.js": ["autotax_team_create_v118", "autotax_team_usage_stats_v118"],
          }
          for url, expected in checks.items():
            last=''
            for attempt in range(7):
              try:
                req=urllib.request.Request(url,headers={
                  "Cache-Control":"no-cache","User-Agent":"AutoTax-Pages-Smoke/1.0"})
                with urllib.request.urlopen(req,timeout=15) as res:
                  body=res.read().decode("utf-8","replace")
                  status=res.status
                missing=[marker for marker in expected if marker not in body]
                if status==200 and not missing:
                  print("PASS",url,"bytes",len(body))
                  break
                last="HTTP "+str(status)+" missing "+repr(missing)
              except Exception as e:
                last=str(e)
              if attempt!=6: time.sleep(7)
            else:
              print("FAIL",url,last)
              sys.exit(1)
          print("AutoTax LIVE pages validated.")
          PY
