name: AutoTax V3.2 sync checks
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "autotax/**"
      - "addon-portal/**"
      - "scripts/verify-v32-sync.mjs"
      - "tests/v32/**"
      - ".github/workflows/verify-v32.yml"
  pull_request:
    paths:
      - "docs/**"
      - "autotax/**"
      - "addon-portal/**"
      - "scripts/verify-v32-sync.mjs"
      - ".github/workflows/verify-v32.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-v32-sync.mjs
      - name: Parse Windows backup script without running it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/backup-supabase-v32.ps1', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

  sql-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: autotax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autotax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: autotax_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap test-only Supabase Auth
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/000_bootstrap_auth.sql
      - name: Install historical V1/V2 schema in isolated database
        # Migration 002 revokes a payment function created in 003; the historical
        # files must be loaded in dependency order for a clean CI fixture.
        run: |
          set -euo pipefail
          for f in \
            addon-portal/supabase/migrations/001_addon_license_portal.sql \
            addon-portal/supabase/migrations/003_sepay_webhook_processing.sql \
            addon-portal/supabase/migrations/002_addon_pricing_and_order_creation.sql \
            addon-portal/supabase/migrations/004_admin_payment_details.sql \
            addon-portal/supabase/migrations/004_show_queued_renewals.sql \
            docs/sql/admin-gifts-pricing.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/010_seed_old_data.sql
      - name: Verify browser-only legacy snapshot creates 11 safe copies
        run: |
          psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/BACKUP_V32_BROWSER_ONLY.sql
          psql -v ON_ERROR_STOP=1 -Atc "select count(*) from autotax_backup_20261101._manifest where rows_original=rows_copied" | grep -x 11
      - name: Validate read-only production preflight SQL syntax
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PREDEPLOY_V32_READ_ONLY.sql
      - name: Dry-run V3.2 upgrade against PostgreSQL 16
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/UPGRADE_V32_CANDIDATE_DO_NOT_RUN.sql
      - name: Verify restricted client roles and RPC grants
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/070_assert_role_permissions.sql
      - name: Verify entitlements and paid/trial scenarios
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/030_assert_v32_upgrade.sql
      - name: Verify additive package lots and independent expiration
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/040_assert_package_lots.sql

      - name: Prepare unrelated-FK rollback scenario in another isolated DB
        run: |
          set -euo pipefail
          createdb autotax_abort_test
          export PGDATABASE=autotax_abort_test
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/000_bootstrap_auth.sql
          for f in \
            addon-portal/supabase/migrations/001_addon_license_portal.sql \
            addon-portal/supabase/migrations/003_sepay_webhook_processing.sql \
            addon-portal/supabase/migrations/002_addon_pricing_and_order_creation.sql \
            addon-portal/supabase/migrations/004_admin_payment_details.sql \
            addon-portal/supabase/migrations/004_show_queued_renewals.sql \
            docs/sql/admin-gifts-pricing.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/010_seed_old_data.sql
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/050_create_external_fk.sql
      - name: Verify dangerous dependency aborts without deleting old records
        run: |
          set -euo pipefail
          export PGDATABASE=autotax_abort_test
          if psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/UPGRADE_V32_CANDIDATE_DO_NOT_RUN.sql >/tmp/v32-expected-abort.log 2>&1; then
            cat /tmp/v32-expected-abort.log
            echo "ERROR: Upgrade unexpectedly succeeded despite unrelated foreign key."
            exit 1
          fi
          if ! grep -qi "cannot truncate a table referenced in a foreign key constraint" /tmp/v32-expected-abort.log; then
            cat /tmp/v32-expected-abort.log
            echo "ERROR: Upgrade failed for an unexpected reason."
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/060_assert_rollback.sql

  package-extension-candidate:
    needs: [validate, sql-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Manifest V3 and package installable extension
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('autotax')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['manifest_version'] == 3
          files = [
            manifest['background']['service_worker'],
            manifest['side_panel']['default_path'],
          ]
          for script in manifest.get('content_scripts', []):
              files.extend(script.get('js', []))
              files.extend(script.get('css', []))
          files.extend(manifest.get('icons', {}).values())
          for path in files:
              if not (root/path).is_file():
                  raise SystemExit('Missing extension resource: '+path)
          version=manifest['version']
          output=pathlib.Path('autotax-v'+version+'-candidate.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=7) as archive:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.suffix not in {'.md'} and '__pycache__' not in p.parts:
                      archive.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              assert 'manifest.json' in archive.namelist()
              assert 'src/sidepanel/index.html' in archive.namelist()
              assert 'src/license/license.js' in archive.namelist()
          print('Created:',output,'version:',version,'items:',len(archive.namelist()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autotax-v32-extension-candidate
          path: autotax-v*-candidate.zip
          retention-days: 14
