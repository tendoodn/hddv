name: AutoTax V3.2 sync checks
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "autotax/**"
      - "addon-portal/**"
      - "scripts/verify-v32-sync.mjs"
      - "scripts/verify-admin-package.mjs"
      - "scripts/verify-web-bridge.mjs"
      - "scripts/verify-web-results.mjs"
      - "tests/v32/**"
      - ".github/workflows/verify-v32.yml"
  pull_request:
    paths:
      - "docs/**"
      - "autotax/**"
      - "addon-portal/**"
      - "scripts/verify-v32-sync.mjs"
      - "scripts/verify-admin-package.mjs"
      - "scripts/verify-web-bridge.mjs"
      - "scripts/verify-web-results.mjs"
      - ".github/workflows/verify-v32.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-v32-sync.mjs
      - run: node scripts/verify-admin-package.mjs
      - run: node scripts/verify-web-bridge.mjs
      - run: node scripts/verify-web-results.mjs
      - name: Verify published Pages branch matches customer/admin and Web code
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin feature/addon-license-portal
          for file in docs/index.html docs/customer.js docs/admin.html docs/admin-mst.js docs/web.html docs/web/*.js docs/web/*.css; do
            if ! git show "FETCH_HEAD:$file" | cmp - "$file" >/dev/null; then
              echo "::error file=$file::Pages branch differs from main. Mirror this change before release."
              exit 1
            fi
          done
          echo "Customer portal, admin and Web sources match the Pages branch."

      - name: Parse Windows backup script without running it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/backup-supabase-v32.ps1', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

  sql-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: autotax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autotax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: autotax_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap test-only Supabase Auth
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/000_bootstrap_auth.sql
      - name: Install historical V1/V2 schema in isolated database
        # Migration 002 revokes a payment function created in 003; the historical
        # files must be loaded in dependency order for a clean CI fixture.
        run: |
          set -euo pipefail
          for f in \
            addon-portal/supabase/migrations/001_addon_license_portal.sql \
            addon-portal/supabase/migrations/003_sepay_webhook_processing.sql \
            addon-portal/supabase/migrations/002_addon_pricing_and_order_creation.sql \
            addon-portal/supabase/migrations/004_admin_payment_details.sql \
            addon-portal/supabase/migrations/004_show_queued_renewals.sql \
            docs/sql/admin-gifts-pricing.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/010_seed_old_data.sql
      - name: Reject production upgrade when no snapshot is present
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PRODUCTION_UPGRADE_V32_ONE_TIME.sql >/tmp/v32-no-backup.log 2>&1; then
            echo "ERROR: upgrade succeeded without required snapshot"
            exit 1
          fi
          grep -q "v32_backup_required_missing_manifest" /tmp/v32-no-backup.log
      - name: Verify browser-only legacy snapshot creates 11 safe copies
        run: |
          psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/BACKUP_V32_BROWSER_ONLY.sql
          psql -v ON_ERROR_STOP=1 -Atc "select count(*) from autotax_backup_20261101._manifest where rows_original=rows_copied" | grep -x 11
      - name: Reject changed legacy data even when snapshot row counts match
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "update public.addon_plans set price_vnd=777 where code='monthly'"
          if psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PRODUCTION_UPGRADE_V32_ONE_TIME.sql >/tmp/v32-stale-snapshot.log 2>&1; then
            echo "ERROR: upgrade accepted stale content with unchanged row count"
            exit 1
          fi
          grep -q "v32_backup_stale_content_for_addon_plans" /tmp/v32-stale-snapshot.log
          psql -v ON_ERROR_STOP=1 -c "update public.addon_plans p set price_vnd=b.price_vnd from autotax_backup_20261101.addon_plans b where p.code=b.code and p.code='monthly'"
      - name: Validate read-only production preflight SQL syntax
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PREDEPLOY_V32_READ_ONLY.sql
      - name: Dry-run V3.2 upgrade against PostgreSQL 16
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PRODUCTION_UPGRADE_V32_ONE_TIME.sql
      - name: Configure fixed 365-day MST products and admin history RPC
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/020_mst_one_year_collapsible_admin_history.sql
      - name: Add secure direct admin package grant RPC
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/021_admin_direct_package_grant.sql
      - name: Add private server-paginated admin transaction history
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/022_admin_paginated_package_transactions.sql
      - name: Fix Supabase pgcrypto package-checkout function search path
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/023_fix_package_checkout_pgcrypto_schema.sql
      - name: Mimic Supabase production pgcrypto installation in extensions schema
        run: |
          psql -v ON_ERROR_STOP=1 -c "create schema if not exists extensions"
          psql -v ON_ERROR_STOP=1 -c "alter extension pgcrypto set schema extensions"
      - name: Add server-timed five-minute QR and private order-status RPC
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/024_five_minute_qr_realtime_order_status.sql
      - name: Add reversible package revocations and transaction identifiers
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/025_admin_revoke_restore_compensation_and_transaction_codes.sql
      - name: Add private history-hide RPC and audited hidden-entry ledger
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/026_hide_inactive_package_history.sql
      - name: Add admin order/reference search RPC
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/027_admin_order_search.sql
      - name: Allow twelve-digit MST in trial and GDT authorization
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/028_mst_12_digit_trial_and_authorization.sql
      - name: Add explicit MST profiles and strict session lock
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/migrations/028_explicit_mst_profiles_and_session_lock.sql
      - name: Verify production readiness report is readable
        run: psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/RELEASE_READINESS_V32_READ_ONLY.sql
      - name: Verify restricted client roles and RPC grants
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/070_assert_role_permissions.sql
      - name: Verify entitlements and paid/trial scenarios
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/030_assert_v32_upgrade.sql
      - name: Verify additive package lots and independent expiration
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/040_assert_package_lots.sql

      - name: Verify fixed MST expiry and private on-demand full package history
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/080_assert_mst_one_year_admin_history.sql

      - name: Verify manual admin package grants and authorization
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/090_assert_admin_direct_grant.sql

      - name: Verify purchase and admin grant history popup paging
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/100_assert_paged_package_transactions.sql

      - name: Verify customer checkout works with pgcrypto in extensions schema
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/110_assert_package_checkout_pgcrypto.sql

      - name: Verify five-minute QR and private order status
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/120_assert_five_minute_qr_status.sql

      - name: Verify audited admin revoke restore compensation and history codes
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/130_assert_admin_revoke_restore_compensation.sql

      - name: Verify only revoked and cancelled package history can be hidden
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/140_assert_hide_inactive_history.sql

      - name: Verify admin order and SePay reference filtering
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/150_assert_order_search.sql

      - name: Verify twelve-digit MST trial and authorization
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/160_assert_twelve_digit_mst.sql

      - name: Verify 12-digit ID and profile lock without auto-enrollment
        run: psql -v ON_ERROR_STOP=1 -f tests/v32/sql/160_assert_mst_profile_lock.sql

      - name: Prepare unrelated-FK rollback scenario in another isolated DB
        run: |
          set -euo pipefail
          createdb autotax_abort_test
          export PGDATABASE=autotax_abort_test
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/000_bootstrap_auth.sql
          for f in \
            addon-portal/supabase/migrations/001_addon_license_portal.sql \
            addon-portal/supabase/migrations/003_sepay_webhook_processing.sql \
            addon-portal/supabase/migrations/002_addon_pricing_and_order_creation.sql \
            addon-portal/supabase/migrations/004_admin_payment_details.sql \
            addon-portal/supabase/migrations/004_show_queued_renewals.sql \
            docs/sql/admin-gifts-pricing.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/010_seed_old_data.sql
          psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/BACKUP_V32_BROWSER_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/050_create_external_fk.sql
      - name: Verify dangerous dependency aborts without deleting old records
        run: |
          set -euo pipefail
          export PGDATABASE=autotax_abort_test
          if psql -v ON_ERROR_STOP=1 -f addon-portal/supabase/PRODUCTION_UPGRADE_V32_ONE_TIME.sql >/tmp/v32-expected-abort.log 2>&1; then
            cat /tmp/v32-expected-abort.log
            echo "ERROR: Upgrade unexpectedly succeeded despite unrelated foreign key."
            exit 1
          fi
          if ! grep -qi "cannot truncate a table referenced in a foreign key constraint" /tmp/v32-expected-abort.log; then
            cat /tmp/v32-expected-abort.log
            echo "ERROR: Upgrade failed for an unexpected reason."
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -f tests/v32/sql/060_assert_rollback.sql

  package-extension-candidate:
    needs: [validate, sql-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Manifest V3 and package installable extension
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('autotax')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['manifest_version'] == 3
          files = [
            manifest['background']['service_worker'],
            manifest['side_panel']['default_path'],
          ]
          for script in manifest.get('content_scripts', []):
              files.extend(script.get('js', []))
              files.extend(script.get('css', []))
          files.extend(manifest.get('icons', {}).values())
          for path in files:
              if not (root/path).is_file():
                  raise SystemExit('Missing extension resource: '+path)
          version=manifest['version']
          output=pathlib.Path('autotax-v'+version+'-candidate.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=7) as archive:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.suffix not in {'.md'} and '__pycache__' not in p.parts:
                      archive.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              assert 'manifest.json' in archive.namelist()
              assert 'src/sidepanel/index.html' in archive.namelist()
              assert 'src/license/license.js' in archive.namelist()
          print('Created:',output,'version:',version,'items:',len(archive.namelist()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autotax-v32-extension-candidate
          path: autotax-v*-candidate.zip
          retention-days: 14
