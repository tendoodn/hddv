plugins { id 'com.android.application' }
android {
    namespace 'top.tracuuhoadon.autotaxlite'
    compileSdk 35
    defaultConfig {
        applicationId 'top.tracuuhoadon.autotaxlite'
        minSdk 24
        targetSdk 35
        versionCode 1200
        versionName '1.2.0'
    }
    flavorDimensions 'edition'
    productFlavors {
        lite {
            dimension 'edition'
            resValue 'string', 'app_name', 'AutoTax Lite'
        }
        full {
            dimension 'edition'
            applicationIdSuffix '.full'
            resValue 'string', 'app_name', 'AutoTax Đầy đủ'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
