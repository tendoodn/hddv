<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
<title id="title">AutoTax — smart invoice automation</title>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#131D29"/>
   <stop offset=".62" stop-color="#070D15"/>
   <stop offset="1" stop-color="#030508"/>
 </linearGradient>
 <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#7AF5FF"/>
   <stop offset=".5" stop-color="#21CEFF"/>
   <stop offset="1" stop-color="#4387FF"/>
 </linearGradient>
</defs>
<rect x="0" y="0" width="512" height="512" rx="112" fill="url(#panel)"/>
<rect x="15" y="15" width="482" height="482" rx="99" fill="none" stroke="#334657" stroke-width="2"/>
<!-- Original AutoTax A monogram: speed, accuracy and automation. -->
<path d="M112 386L214 158Q232 120 250 158L352 386" fill="none" stroke="#F2F7FF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M175 313H288" fill="none" stroke="url(#signal)" stroke-width="34" stroke-linecap="round"/>
<!-- Distinct circuit-check indicator: never a reuse of legacy Tendoo curves. -->
<path d="M306 290L335 319L388 257" fill="none" stroke="url(#signal)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="386" cy="158" r="17" fill="#3ECDEB"/>
</svg>
