/* V9: 3 columns CCCD and 6 documents per row */
.cccd-record{display:grid;grid-template-columns:minmax(185px,1.05fr) minmax(0,2fr);gap:8px;align-items:stretch;padding:9px}
.cccd-record .cccd-info{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.cccd-record .cccd-faces{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0}
.cccd-info .itemhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cccd-info .field{display:block}.cccd-info .field input{width:100%;margin-top:3px}
.cccd-info>button{margin-top:auto!important;width:100%}
.cccd-face .fields{display:flex;flex-direction:column;align-items:stretch}.cccd-face .fields input{width:100%;font-size:11px}.cccd-face .thumb{width:100%;height:85px;object-fit:contain}
.cccd-face .cropbox{display:flex;flex-direction:row;gap:4px;padding:5px}.cccd-face .cropbox select{width:100%;max-width:none}
.doc-pages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;overflow-x:auto;margin:8px 0}
.doc-pages>.item{margin:0;padding:7px;min-width:110px}.doc-pages .fields{display:block;margin:5px 0}.doc-pages input[type=file]{width:100%;font-size:10px}.doc-pages .thumb{height:105px}.doc-pages .cropbox{padding:5px;gap:4px}.doc-pages .cropbox select,.doc-pages .cropbox button{width:100%;font-size:11px;padding:6px}.doc-pages>.item>button{width:100%;margin-top:7px;padding:7px;font-size:12px}

/* V10: giao diện tải ảnh không còn nhãn mặc định sai lệch của trình duyệt */

   onProgress?.(pageNum,pdf.numPages);

     filename:(file.name||'tailen.pdf')+'#'+pageNum,
     cropMode:'manual',cropRects:{}

let previewFitObserver;
function queuePreviewFit(top,bottom,objects,gen){
 const run=()=>{if(gen!==renderGeneration)return;fitPreviewPair(top,objects,gen);fitPreviewPair(bottom,objects,gen)};
 if(!('IntersectionObserver' in window)){setTimeout(run,200);return}
 previewFitObserver?.disconnect();
 previewFitObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){previewFitObserver.disconnect();setTimeout(run,0)}},{rootMargin:'150px'});
 previewFitObserver.observe($('preview'));
}

  [...row.children].forEach(im=>{im.style.width=w+'px';im.style.height=h+'px';im.style.flex='0 0 '+w+'px';im.style.objectFit='fill';im.style.margin='0';im.style.padding='0'});
 }catch(e){console.warn(e)}
}
function scalePreview(){const area=$('preview');if(!area)return;const scale=Math.min(1,(area.clientWidth-8)/595);for(const el of area.querySelectorAll('.sheet')){el.style.transformOrigin='top center';el.style.transform=`scale(${scale})`;el.style.marginBottom=`${842*(scale-1)+14}px`}}window.addEventListener('resize',scalePreview);
$('batch').onchange=async e=>{const files=[...e.target.files];if(mode==='cccd'){for(let i=0;i<files.length;i+=2)addRecord([await url(files[i]),files[i+1]?await url(files[i+1]):null])}else {if(files.length)addRecord(await Promise.all(files.map(url)))}e.target.value=''};
$('pdfBatch').onchange=async e=>{const files=[...(e.target.files||[])];e.target.value='';await importPdfBatch(files)};
function cleanName(s){return (s||'').normalize('NFC').replace(/[\/:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}
// OCR chỉ khởi động khi có ảnh mặt trước; ảnh CCCD không được gửi tới máy chủ ứng dụng.
let workerPromise,ocrLibPromise,ocrQueue=Promise.resolve();
function loadOCR(){
 if(window.Tesseract)return Promise.resolve(window.Tesseract);
 if(ocrLibPromise)return ocrLibPromise;
 ocrLibPromise=new Promise((resolve,reject)=>{
  const el=document.createElement('script');
  el.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  el.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('Không khởi tạo được OCR'));
  el.onerror=()=>reject(Error('Không tải được OCR. Hãy kết nối Internet để đọc tên, hoặc nhập thủ công.'));
  document.head.append(el);
 }).catch(e=>{ocrLibPromise=null;throw e});return ocrLibPromise;
}
function normalizeOcrName(raw){
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const excluded=/^(?:họ|ho|full\s*name|ngày|date|giới|sex|quốc|national|số|no\b|place|cộng|identity|citizen|personal|identification|việt\s*nam)/i;
 const candidates=[];
 for(let i=0;i<lines.length;i++){
  let t=lines[i].replace(/^(?:họ\s*(?:và|,?\s*chữ\s*đệm\s*và)?\s*tên|full\s*name)\s*(?:\/\s*full\s*name)?\s*[:：.-]?/i,'').trim();
  t=t.replace(/[^\p{L}\s'-]/gu,' ').replace(/\s+/g,' ').trim();
  if(!t||excluded.test(t)||t.length<5||t.length>65)continue;
  const words=t.split(/\s+/);
  if(words.length<2||words.length>7)continue;
  let score=words.length*3+(t===t.toUpperCase()?8:0)+(i>0?1:0);
  if(/(?:Họ|Full\s*name)/i.test(lines[i-1]||''))score+=15;
  candidates.push({name:t.toLocaleUpperCase('vi-VN'),score});
 }
 candidates.sort((x,y)=>y.score-x.score);return candidates[0]?.name||'';
}
async function getNameCrop(src){
 const im=await loadImg(src),canvas=document.createElement('canvas');
 // Hai thế hệ CCCD đều có dòng tên ở nửa phải, phía dưới số định danh.
 const x=.265,y=.465,w=.53,h=.27;
 canvas.width=Math.min(1800,Math.round(im.naturalWidth*w*2));
 canvas.height=Math.round(canvas.width*h/w);
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(im,im.naturalWidth*x,im.naturalHeight*y,im.naturalWidth*w,im.naturalHeight*h,0,0,canvas.width,canvas.height);
 return canvas;
}
async function scanName(r){
 if(mode!=='cccd'||!r.images[0]?.data)return;
 const src=r.images[0].data;
 const requestId=r.ocrRequestId=(r.ocrRequestId||0)+1;
 r.ocrStatus='Đang nhận dạng tên...';render();
 ocrQueue=ocrQueue.catch(()=>{}).then(async()=>{
  try{
   const lib=await loadOCR();
   if(!workerPromise)workerPromise=lib.createWorker('vie+eng');
   const worker=await workerPromise;
   const crop=await getNameCrop(src);
   const result=await worker.recognize(crop);
   let found=normalizeOcrName(result.data.text||'');
   if(!found){const full=await worker.recognize(src);found=normalizeOcrName(full.data.text||'')}
   if(r.images[0]?.data!==src||!records.includes(r)||r.ocrRequestId!==requestId)return;
   if(found)r.name=compactPdfName(found);
   r.ocrStatus=found?'Đã nhận dạng tên — đã chuyển không dấu.':'Không nhận dạng chắc chắn; vui lòng nhập tên.';
  }catch(e){if(r.images[0]?.data===src&&r.ocrRequestId===requestId)r.ocrStatus='OCR không khả dụng: '+(e.message||'hãy nhập tên thủ công');}
  render();
 });

}
function compactPdfName(name){

function displayRecordName(r,i){return String(i+1).padStart(2,'0')+compactPdfName(r.name)}

// Bộ tạo PDF JPEG thuần JavaScript: không phụ thuộc CDN.
function loadImg(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Không đọc được ảnh'));im.src=src})}

function encodePdf(pages){

 function put(v){const bytes=typeof v==='string'?enc.encode(v):v;chunks.push(bytes);len+=bytes.length}

 put('%PDF-1.4\n');const n=2+pages.length*3;obj(1,'<< /Type /Catalog /Pages 2 0 R >>');

 for(let i=0;i<pages.length;i++){
  const p=pages[i],pn=3+i*3,imn=pn+1,cn=pn+2,bytes=Uint8Array.from(atob(p.jpeg.split(',')[1]),c=>c.charCodeAt(0));
  obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+imn+' 0 R >> >> /Contents '+cn+' 0 R >>');
  offsets[imn]=len;put(imn+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');put(bytes);put('\nendstream\nendobj\n');
  const commands='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q\n';obj(cn,'<< /Length '+enc.encode(commands).length+' >>\nstream\n'+commands+'endstream');
 }

async function makePages(r,scale,quality){
 const pages=[],W=Math.round(794*scale),H=Math.round(1123*scale),mm=W/210;

 const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='white';ctx.fillRect(0,0,W,H);return {c,ctx}};
 const finish=p=>pages.push({jpeg:p.c.toDataURL('image/jpeg',quality),w:W,h:H});
 const paint=async(ctx,obj,mono,x,y,w,h)=>{const out=await croppedImage(obj,mono,{maxEdge:Math.round(1800*scale),quality:.92});const im=await loadImg(out.data);const ratio=Math.min(w/im.width,h/im.height),dw=im.width*ratio,dh=im.height*ratio;ctx.drawImage(im,(x+(w-dw)/2)*mm,(y+(h-dh)/2)*mm,dw*mm,dh*mm)};

 if(mode==='cccd'){
  const p=mk(),imgs=r.images;
  // Exact edge-to-edge placement. All saved CCCD images are cropped to 1.586:1.
  const h=64, eachW=h*1.586, x0=(210-2*eachW)/2;
  const drawPair=async(mono,y)=>{
   for(let i=0;i<2;i++){
    const out=await croppedImage(imgs[i],mono,{maxEdge:Math.round(1900*scale),quality:.92});
    const im=await loadImg(out.data);
    p.ctx.drawImage(im,(x0+i*eachW)*mm,y*mm,eachW*mm,h*mm);
   }
  };
  await drawPair(false,11);
  sig(p.ctx,78,84,54,28);
  await drawPair(true,122);
  finish(p);
 }else{
  for(const mono of [false,true])for(const obj of r.images){const p=mk();await paint(p.ctx,obj,mono,15,10,180,239);if(mono)sig(p.ctx,78,257,54,35);finish(p)}
 }

}
async function buildPdf(r){if(r.images.some(o=>!o.data))throw Error('Hồ sơ còn ảnh chưa tải lên.');let blob;

}

async function exportAll(){if(!records.length)return alert('Chưa có hồ sơ.');const btn=$('export');btn.disabled=true;const used=new Set();try{if(typeof JSZip==='undefined')throw Error('Bộ tạo ZIP chưa khởi tạo');const zip=new JSZip();for(let i=0;i<records.length;i++){btn.textContent='Đang tạo '+(i+1)+'/'+records.length+'...';const blob=await buildPdf(records[i]);let base=numberedPdfName(records[i],i).replace(/\.pdf$/i,''),name=base+'.pdf',n=2;while(used.has(name.toLowerCase()))name=base+'_'+n+++'.pdf';used.add(name.toLowerCase());zip.file(name,blob)}downloadBlob(await zip.generateAsync({type:'blob'}),'Doi_chieu_'+mode+'.zip')}catch(e){console.error(e);alert('Lỗi xuất ZIP: '+e.message)}finally{btn.disabled=false;btn.textContent='↓ Tải tất cả PDF (.ZIP)'}}
